name: supabase-keepalive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Error: SUPABASE_URL or SUPABASE_PUBLISHABLE_KEY is missing in GitHub secrets!"
            exit 1
          fi
          res=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY")
          echo "Supabase HTTP response code: $res"
          if [ "$res" -eq 200 ]; then
            echo "Success! Supabase is kept alive."
          else
            echo "Failed with HTTP status $res"
            exit 1
          fi